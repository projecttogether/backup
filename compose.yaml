# Production on a Linux server (Debian, Ubuntu) with Docker Compose: the
# image as two processes, the web app (`web`: the interface and the agents'
# uploads) and the worker (`worker`: schedules, Google Drive, S3 bucket and
# Personio backups, the daily upkeep, alerts), after a one-off migration.
# Settings live in .env next to this file (docs/configuration.md). Start it
# with:
#
#   docker compose up -d --pull always
#
# BACKUP_IMAGE_TAG in .env selects the image of ghcr.io/projecttogether/backup:
# latest (the newest commit on main, the default) or sha-<commit> for one
# build. To upgrade, run the same command again: it pulls the newer image.
#
# Without a PostgreSQL of your own, add compose.postgres.yaml
# (COMPOSE_FILE=compose.yaml:compose.postgres.yaml in .env).
#
# `web` listens on 127.0.0.1:3000 (BACKUP_PORT changes the host port), for a
# reverse proxy on the same server, such as Caddy, that terminates HTTPS; set
# APP_URL to its public https URL. The proxy must accept request bodies of
# 16 MiB (the agents' parts). The `data` volume holds the local copies of
# Google Drive, S3 buckets and Personio and restic's cache.

x-image: &image ghcr.io/projecttogether/backup:${BACKUP_IMAGE_TAG:-latest}

# Every variable in .env reaches the containers (docs/configuration.md); the
# required ones are checked here so a missing value stops the start.
x-app-environment: &app-environment
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
  APP_URL: ${APP_URL:?Set APP_URL}
  AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
  OIDC_ISSUER: ${OIDC_ISSUER:?Set OIDC_ISSUER}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Set OIDC_CLIENT_ID}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Set OIDC_CLIENT_SECRET}
  # Schedules and the daily upkeep follow this time zone.
  TZ: ${TZ:-UTC}
  # The reverse proxy in front of the app sets X-Forwarded-For.
  TRUST_PROXY: ${TRUST_PROXY:-true}

x-app: &app
  image: *image
  env_file:
    - path: .env
      required: false
  environment: *app-environment

services:
  migrate:
    <<: *app
    command: ["migrate"]
    restart: "no"
    # `docker compose run --rm -T migrate cli …` (the operator command) works
    # on the same local copies and restic cache as web and worker.
    volumes:
      - data:/data

  web:
    <<: *app
    command: ["web"]
    restart: unless-stopped
    # A stop (an upgrade) ends the agents' uploads: restic gets the time to
    # remove its locks, and a scheduled backup is queued again.
    stop_grace_period: 1m
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - data:/data
    ports:
      # Only on the server itself, for the reverse proxy. BACKUP_PORT picks
      # another host port when 3000 is taken, e.g. by another app.
      - "127.0.0.1:${BACKUP_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/-/readyz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    <<: *app
    command: ["worker"]
    restart: unless-stopped
    # A stop (an upgrade) ends the run that executes, the same way as for web.
    stop_grace_period: 1m
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - data:/data
    healthcheck:
      # The worker touches the file every few seconds while it runs.
      test:
        - CMD
        - node
        - -e
        - "const s = require('node:fs').statSync('/tmp/worker-heartbeat', { throwIfNoEntry: false }); process.exit(s && Date.now() - s.mtimeMs < 60000 ? 0 : 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  data:
